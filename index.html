<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>珍珠奶茶學漢字</title>

<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #fff8f0, transparent 30%),
        linear-gradient(135deg, #f8e6d6, #fff7ef);

    min-height: 100vh;
    color: #65402c;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* =========================
   遊戲外框
========================= */

.game {
    max-width: 1250px;
    min-height: 100vh;
    margin: auto;
    padding: 20px;
}

/* =========================
   標題
========================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.title {
    font-size: 38px;
    font-weight: 900;
    color: #704128;
    text-shadow: 3px 3px 0 #fff;
}

.title span {
    color: #ef7890;
}

.status {
    display: flex;
    gap: 25px;
    background: rgba(255,255,255,.85);
    padding: 14px 28px;
    border-radius: 25px;
    box-shadow: 0 5px 15px rgba(100,60,30,.12);
}

.status-item {
    text-align: center;
}

.status-label {
    font-size: 15px;
}

.status-number {
    font-size: 25px;
    font-weight: bold;
}

/* =========================
   主畫面
========================= */

.main {
    display: grid;
    grid-template-columns: 55% 45%;
    gap: 15px;
}

/* =========================
   左側題目
========================= */

.quiz-card {
    background: rgba(255,255,255,.88);
    border-radius: 30px;
    padding: 28px;
    box-shadow: 0 8px 25px rgba(100,60,30,.12);
}

.level {
    display: inline-block;
    background: #ef8293;
    color: white;
    padding: 9px 20px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 20px;
}

.question-title {
    font-size: 27px;
    font-weight: bold;
    margin: 18px 0;
}

.character-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

.character {
    width: 230px;
    height: 230px;

    background: #fffaf5;

    border: 4px solid #f3c8b2;

    border-radius: 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "KaiTi", "DFKai-SB", serif;

    font-size: 150px;

    color: #684025;

    box-shadow:
        inset 0 0 0 2px white;
}

.sound-button {
    width: 65px;
    height: 65px;

    border: none;
    border-radius: 50%;

    background: #ef7c8d;
    color: white;

    font-size: 28px;

    box-shadow: 0 5px 10px rgba(200,80,100,.25);
}

.sound-button:hover {
    transform: scale(1.08);
}

/* =========================
   答案
========================= */

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;

    margin-top: 25px;
}

.answer {
    min-height: 75px;

    border: 3px solid #f0d4c3;

    background: #fff;

    border-radius: 20px;

    font-family: "KaiTi", "DFKai-SB", serif;

    font-size: 42px;

    color: #694328;

    transition: .2s;
}

.answer:hover {
    transform: translateY(-3px);
    border-color: #ef8494;
}

.answer.correct {
    background: #e6f6df;
    border-color: #68b85a;
    color: #4e9b45;
}

.answer.wrong {
    background: #ffe2e2;
    border-color: #e47777;
    color: #c95757;
}

/* =========================
   回饋文字
========================= */

.feedback {
    min-height: 50px;

    margin-top: 15px;

    text-align: center;

    font-size: 25px;

    font-weight: bold;
}

.feedback.good {
    color: #4e9b45;
}

.feedback.bad {
    color: #d85c69;
}

/* =========================
   小姐姐區域
========================= */

.girl-area {
    position: relative;

    min-height: 560px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    overflow: hidden;

    border-radius: 30px;

    background:
        radial-gradient(circle at 70% 20%, #fff8ee, transparent 30%),
        linear-gradient(#f9d8d5, #f5c7bc);

    box-shadow: 0 8px 25px rgba(100,60,30,.12);
}

/* =========================
   漫畫小姐姐
========================= */

.girl {
    position: relative;

    width: 330px;
    height: 470px;

    transition: .3s;
}

.hair {
    position: absolute;

    top: 30px;
    left: 20px;

    width: 290px;
    height: 270px;

    background: #ef9eb3;

    border-radius:
        48% 48% 45% 45%;

    box-shadow:
        inset -15px -5px 0 rgba(190,90,120,.12);
}

.hair::before {
    content: "";

    position: absolute;

    top: -35px;
    left: 100px;

    width: 100px;
    height: 100px;

    background: #ef9eb3;

    border-radius: 50%;
}

.face {
    position: absolute;

    top: 100px;
    left: 65px;

    width: 200px;
    height: 205px;

    background: #ffe5d4;

    border-radius: 48% 48% 45% 45%;
}

.eye {
    position: absolute;

    top: 65px;

    width: 42px;
    height: 48px;

    background: white;

    border: 4px solid #553b35;

    border-radius: 50%;
}

.eye::after {
    content: "";

    position: absolute;

    width: 17px;
    height: 23px;

    background: #6b7b50;

    border-radius: 50%;

    left: 8px;
    top: 9px;
}

.eye.left {
    left: 42px;
}

.eye.right {
    right: 42px;
}

.glasses {
    position: absolute;

    top: 57px;
    left: 27px;

    width: 150px;
    height: 58px;

    border-top: 5px solid #423b3a;

    z-index: 5;
}

.glasses::before,
.glasses::after {

    content: "";

    position: absolute;

    width: 65px;
    height: 55px;

    border: 5px solid #423b3a;

    border-radius: 50%;
}

.glasses::before {
    left: 0;
}

.glasses::after {
    right: 0;
}

.nose {
    position: absolute;

    top: 120px;
    left: 98px;

    width: 5px;
    height: 15px;

    background: #d69b83;

    border-radius: 50%;
}

.mouth {
    position: absolute;

    top: 145px;
    left: 82px;

    width: 40px;
    height: 18px;

    border-bottom: 5px solid #b84d63;

    border-radius: 50%;
}

.body {
    position: absolute;

    bottom: 0;
    left: 35px;

    width: 260px;
    height: 190px;

    background: #4e4556;

    border-radius: 50px 50px 0 0;
}

.collar {
    position: absolute;

    top: 0;
    left: 85px;

    width: 90px;
    height: 65px;

    background: #efe3d1;

    clip-path: polygon(0 0, 100% 0, 70% 100%, 30% 100%);
}

.arm {
    position: absolute;

    bottom: 50px;

    width: 90px;
    height: 35px;

    background: #ffe5d4;

    border-radius: 30px;
}

.arm.left {
    left: 0;

    transform: rotate(25deg);
}

.arm.right {
    right: 0;

    transform: rotate(-25deg);
}

/* =========================
   珍珠奶茶
========================= */

.drink {
    position: absolute;

    bottom: 40px;

    left: 110px;

    width: 110px;

    height: 170px;

    background:
        linear-gradient(
            rgba(255,255,255,.35),
            rgba(255,255,255,.05)
        ),
        #d9a777;

    border: 5px solid #80583d;

    border-radius: 10px 10px 25px 25px;

    z-index: 10;

    transition: .5s;

    display: none;
}

.drink::before {
    content: "";

    position: absolute;

    top: -22px;

    left: 35px;

    width: 35px;

    height: 25px;

    background: #eee;

    border-radius: 10px 10px 0 0;
}

.straw {
    position: absolute;

    top: -90px;

    left: 60px;

    width: 13px;

    height: 110px;

    background: #6d5146;

    transform: rotate(5deg);
}

.pearls {
    position: absolute;

    bottom: 10px;

    left: 10px;

    right: 10px;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 6px;
}

.pearl {
    width: 22px;
    height: 22px;

    background: #54352a;

    border-radius: 50%;

    box-shadow:
        inset 3px 3px 3px rgba(255,255,255,.25);
}

/* =========================
   珍珠進度
========================= */

.pearl-box {

    position: absolute;

    top: 20px;
    right: 20px;

    background: rgba(255,255,255,.9);

    padding: 15px 20px;

    border-radius: 20px;

    text-align: center;

    font-weight: bold;
}

.pearl-progress {

    display: flex;

    gap: 7px;

    margin-top: 8px;
}

.pearl-mini {

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: #ead8cf;

    border: 2px solid #a88370;
}

.pearl-mini.active {
    background: #56352b;
}

/* =========================
   底部
========================= */

.bottom {

    margin-top: 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: rgba(255,255,255,.8);

    padding: 12px 20px;

    border-radius: 20px;
}

.words {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.word {

    padding: 7px 12px;

    border-radius: 10px;

    background: #f3e2d4;

    font-family: "KaiTi", serif;

    font-size: 22px;
}

.word.locked {
    opacity: .45;
}

.next {

    border: none;

    background: #ef7c8d;

    color: white;

    font-size: 22px;

    font-weight: bold;

    padding: 14px 30px;

    border-radius: 18px;
}

/* =========================
   完成畫面
========================= */

.finish {

    position: fixed;

    inset: 0;

    background: rgba(80,45,35,.6);

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 100;
}

.finish-card {

    background: #fffaf5;

    width: min(90%, 600px);

    padding: 40px;

    border-radius: 35px;

    text-align: center;

    box-shadow: 0 15px 50px rgba(0,0,0,.3);

    animation: pop .5s ease;
}

@keyframes pop {

    from {
        transform: scale(.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}

.finish-card h1 {

    font-size: 42px;

    color: #e87588;
}

.big-drink {

    font-size: 120px;

    margin: 15px;
}

.restart {

    border: none;

    background: #ef7c8d;

    color: white;

    padding: 15px 35px;

    border-radius: 20px;

    font-size: 22px;

    font-weight: bold;
}

/* =========================
   RWD
========================= */

@media(max-width: 850px) {

    .main {
        grid-template-columns: 1fr;
    }

    .girl-area {
        min-height: 520px;
    }

    .title {
        font-size: 25px;
    }

    .status {
        padding: 10px;
        gap: 10px;
    }

}

@media(max-width: 500px) {

    .game {
        padding: 10px;
    }

    .header {
        flex-direction: column;
        gap: 10px;
    }

    .character {
        width: 180px;
        height: 180px;
        font-size: 110px;
    }

    .answers {
        gap: 8px;
    }

    .answer {
        font-size: 34px;
    }

}

</style>
</head>

<body>

<div class="game">

    <!-- 標題 -->

    <header class="header">

        <div class="title">
            🧋 珍珠奶茶<span>學漢字</span>
        </div>

        <div class="status">

            <div class="status-item">
                <div class="status-label">⭐ 分數</div>
                <div class="status-number" id="score">0</div>
            </div>

            <div class="status-item">
                <div class="status-label">🏆 關卡</div>
                <div class="status-number" id="levelText">1 / 3</div>
            </div>

        </div>

    </header>


    <!-- 主遊戲 -->

    <main class="main">

        <!-- 左邊 -->

        <section class="quiz-card">

            <div class="level" id="levelName">
                第一關
            </div>

            <div class="question-title">
                🔊 請聽聲音，選出正確的中文字
            </div>

            <div class="character-area">

                <div
                    class="character"
                    id="character"
                >
                    ？
                </div>

                <button
                    class="sound-button"
                    onclick="speakCharacter()"
                >
                    🔊
                </button>

            </div>


            <div
                class="answers"
                id="answers"
            ></div>


            <div
                class="feedback"
                id="feedback"
            >
            </div>

        </section>


        <!-- 右邊小姐姐 -->

        <section class="girl-area">

            <div class="pearl-box">

                🧋 珍珠進度

                <div
                    class="pearl-progress"
                    id="pearlProgress"
                >
                </div>

            </div>


            <div class="girl">

                <div class="hair"></div>

                <div class="face">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="glasses"></div>

                    <div class="nose"></div>

                    <div
                        class="mouth"
                        id="mouth"
                    ></div>

                </div>

                <div class="body">

                    <div class="collar"></div>

                </div>

                <div class="arm left"></div>
                <div class="arm right"></div>

                <!-- 完成後出現 -->

                <div
                    class="drink"
                    id="drink"
                >

                    <div class="straw"></div>

                    <div
                        class="pearls"
                        id="drinkPearls"
                    ></div>

                </div>

            </div>

        </section>

    </main>


    <!-- 底部 -->

    <div class="bottom">

        <div
            class="words"
            id="words"
        ></div>

        <button
            class="next"
            onclick="nextQuestion()"
            id="nextButton"
        >
            下一題 ➜
        </button>

    </div>

</div>


<!-- 完成視窗 -->

<div
    class="finish"
    id="finish"
>

    <div class="finish-card">

        <h1>
            🎉 太棒了！
        </h1>

        <div class="big-drink">
            🧋
        </div>

        <p style="font-size:25px;">
            你收集了 5 顆珍珠！
        </p>

        <p style="font-size:22px;">
            小姐姐做好了珍珠奶茶送給你！
        </p>

        <button
            class="restart"
            onclick="restartGame()"
        >
            再玩一次
        </button>

    </div>

</div>


<script>

/* =====================================================
   遊戲資料
===================================================== */

const allCharacters = [
    "人",
    "口",
    "大",
    "小",
    "土",
    "力",
    "白",
    "天",
    "山",
    "日",
    "月",
    "中",
    "文",
    "上",
    "下"
];


/* =====================================================
   三個難度
===================================================== */

const levels = [

    {
        name: "第一關",
        characters: [
            "人",
            "口",
            "大",
            "小",
            "土"
        ]
    },

    {
        name: "第二關",
        characters: [
            "力",
            "白",
            "天",
            "山",
            "日"
        ]
    },

    {
        name: "第三關",
        characters: [
            "月",
            "中",
            "文",
            "上",
            "下"
        ]
    }

];


/* =====================================================
   遊戲狀態
===================================================== */

let currentLevel = 0;

let currentQuestion = 0;

let score = 0;

let pearls = 0;

let currentAnswer = "";

let answered = false;


/* =====================================================
   開始遊戲
===================================================== */

function startGame() {

    currentLevel = 0;

    currentQuestion = 0;

    score = 0;

    pearls = 0;

    answered = false;

    updateScore();

    createPearls();

    showQuestion();

}


/* =====================================================
   顯示題目
===================================================== */

function showQuestion() {

    answered = false;

    const level =
        levels[currentLevel];

    const characters =
        level.characters;

    currentAnswer =
        characters[currentQuestion];

    document.getElementById("levelName")
        .textContent =
        level.name;

    document.getElementById("levelText")
        .textContent =
        `${currentLevel + 1} / 3`;

    document.getElementById("character")
        .textContent =
        currentAnswer;

    document.getElementById("feedback")
        .textContent = "";

    document.getElementById("feedback")
        .className =
        "feedback";


    /* 小姐姐恢復正常表情 */

    happyFace();


    /* 產生答案 */

    createAnswers(
        currentAnswer,
        characters
    );


    /* 底部字詞 */

    createWordBar();

}


/* =====================================================
   產生選項
===================================================== */

function createAnswers(
    correct,
    characterList
) {

    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    let choices =
        [...characterList];


    /* 洗牌 */

    choices.sort(
        () => Math.random() - .5
    );


    choices.forEach(character => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent =
            character;

        button.onclick =
            () => checkAnswer(
                character,
                button
            );

        answers.appendChild(button);

    });

}


/* =====================================================
   判斷答案
===================================================== */

function checkAnswer(
    selected,
    button
) {

    if (answered) return;

    answered = true;


    if (selected === currentAnswer) {

        /* 答對 */

        button.classList.add("correct");

        score += 10;

        pearls++;

        updateScore();

        updatePearls();

        document.getElementById("feedback")
            .textContent =
            "😊 答對了！真棒！";

        document.getElementById("feedback")
            .className =
            "feedback good";

        happyFace();


        /* 語音鼓勵 */

        speakText("答對了，真棒！");


        /* 第五顆珍珠 */

        if (pearls >= 5) {

            setTimeout(
                finishGame,
                900
            );

        }

    } else {

        /* 答錯 */

        button.classList.add("wrong");

        document.getElementById("feedback")
            .textContent =
            "😢 再試一次看看！";

        document.getElementById("feedback")
            .className =
            "feedback bad";

        sadFace();

        speakText("再試一次看看");

        answered = false;

    }

}


/* =====================================================
   下一題
===================================================== */

function nextQuestion() {

    if (!answered) {

        return;

    }


    currentQuestion++;


    if (
        currentQuestion >=
        levels[currentLevel].characters.length
    ) {

        currentQuestion = 0;

        currentLevel++;

        if (
            currentLevel >= levels.length
        ) {

            currentLevel = 0;

        }

    }


    showQuestion();

}


/* =====================================================
   語音
===================================================== */

function speakCharacter() {

    speakText(
        currentAnswer
    );

}


function speakText(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "你的瀏覽器不支援語音功能"
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );

    speech.lang =
        "zh-TW";

    speech.rate =
        0.8;

    speech.pitch =
        1.1;

    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   分數
===================================================== */

function updateScore() {

    document.getElementById("score")
        .textContent =
        score;

}


/* =====================================================
   珍珠
===================================================== */

function createPearls() {

    const box =
        document.getElementById(
            "pearlProgress"
        );

    box.innerHTML = "";


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const pearl =
            document.createElement("div");

        pearl.className =
            "pearl-mini";

        box.appendChild(
            pearl
        );

    }

}


function updatePearls() {

    const pearlsUI =
        document.querySelectorAll(
            ".pearl-mini"
        );


    pearlsUI.forEach(
        (pearl, index) => {

            if (
                index < pearls
            ) {

                pearl.classList.add(
                    "active"
                );

            }

        }
    );


    /* 杯子裡的珍珠 */

    const drinkPearls =
        document.getElementById(
            "drinkPearls"
        );

    drinkPearls.innerHTML = "";


    for (
        let i = 0;
        i < pearls;
        i++
    ) {

        const pearl =
            document.createElement(
                "div"
            );

        pearl.className =
            "pearl";

        drinkPearls.appendChild(
            pearl
        );

    }

}


/* =====================================================
   小姐姐表情
===================================================== */

function happyFace() {

    const mouth =
        document.getElementById(
            "mouth"
        );

    mouth.style.width =
        "40px";

    mouth.style.height =
        "18px";

    mouth.style.borderBottom =
        "5px solid #b84d63";

    mouth.style.borderTop =
        "none";

}


function sadFace() {

    const mouth =
        document.getElementById(
            "mouth"
        );

    mouth.style.width =
        "38px";

    mouth.style.height =
        "20px";

    mouth.style.borderBottom =
        "none";

    mouth.style.borderTop =
        "5px solid #b84d63";

}


/* =====================================================
   底部漢字
===================================================== */

function createWordBar() {

    const bar =
        document.getElementById(
            "words"
        );

    bar.innerHTML = "";


    allCharacters.forEach(
        (character, index) => {

            const span =
                document.createElement(
                    "span"
                );

            span.className =
                "word";


            if (
                index >
                (currentLevel + 1) * 5 - 1
            ) {

                span.classList.add(
                    "locked"
                );

                span.textContent =
                    "🔒";

            } else {

                span.textContent =
                    character;

            }


            bar.appendChild(
                span
            );

        }
    );

}


/* =====================================================
   完成遊戲
===================================================== */

function finishGame() {

    const drink =
        document.getElementById(
            "drink"
        );

    drink.style.display =
        "block";


    updatePearls();


    setTimeout(() => {

        document.getElementById(
            "finish"
        ).style.display =
            "flex";

        speakText(
            "太棒了！你收集了五顆珍珠！"
        );

    }, 500);

}


/* =====================================================
   重新開始
===================================================== */

function restartGame() {

    document.getElementById(
        "finish"
    ).style.display =
        "none";


    document.getElementById(
        "drink"
    ).style.display =
        "none";


    startGame();

}


/* =====================================================
   啟動
===================================================== */

startGame();

</script>
